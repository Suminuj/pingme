<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>PingMe — Stay connected</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell"><header class="topbar"><a class="brand" href="#"><span class="brand-mark">P</span><span>Ping<span class="brand-accent">Me</span></span></a><button class="icon-button" id="themeToggle" aria-label="Switch theme">☾</button></header><section class="welcome"><div class="eyebrow"><span class="pulse"></span> YOUR PEOPLE, ONE PLACE</div><h1>Good conversations<br><span>start with a ping.</span></h1><p class="intro">A simple space to stay close to the people who matter.</p></section><section class="auth-card"><div class="card-heading"><div><p class="section-kicker">GET STARTED</p><h2>Welcome to PingMe</h2></div><span class="lock-mark">✦</span></div><div class="tabs"><button class="tab active" id="loginTab">Log in</button><button class="tab" id="signupTab">Create account</button></div><form id="authForm"><label for="displayName" id="nameLabel" class="hidden">Your name</label><input id="displayName" placeholder="Your name" class="hidden"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" placeholder="Enter your password" minlength="6" required><button type="button" id="showPassword" class="show-password">Show</button></div><button class="primary-button" type="submit"><span id="submitText">Log in</span> →</button><p class="form-message" id="formMessage" role="status">Authentication will be connected next.</p></form><p class="terms">Use PingMe respectfully and keep your account secure.</p></section><footer class="footer"><span>PingMe</span><span>Ping me. Stay connected.</span></footer></main><s
